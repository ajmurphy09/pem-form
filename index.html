<!doctype html>
<html>
<head>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>PEM Log</title>
  <style>
    body { font-family: system-ui, -apple-system, Arial; margin: 16px; max-width: 640px; }
    h2 { margin: 8px 0 2px; }
    .sub { color: #555; margin: 0 0 12px; }
    label { display:block; margin-top: 14px; font-weight: 600; }
    input, select, textarea, button { width: 100%; font-size: 16px; padding: 10px; margin-top: 6px; }
    .row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    .pillbox { display:flex; flex-wrap:wrap; gap:10px; margin-top:8px; }
    .pill { display:flex; gap:8px; align-items:center; padding:8px 10px; border:1px solid #ddd; border-radius:999px; }
    button { margin-top: 18px; font-weight: 800; }
    .status { margin-top: 12px; font-weight: 600; }
    .ok { color: #0a7a2f; }
    .bad { color: #b00020; }
    .tiny { font-size: 13px; color: #666; margin-top: 8px; }

    /* Symptom toggle + rating UI */
    .symptomRow { border: 1px solid #ddd; border-radius: 14px; padding: 10px; margin-top: 10px; }
    .symptomTop { display:flex; align-items:flex-start; justify-content:space-between; gap: 10px; }
    .symptomName { font-weight: 700; line-height: 1.2; }
    .symptomControls { margin-top: 10px; display:none; }
    .sliderWrap { display:flex; align-items:center; gap: 10px; }
    .sliderWrap input[type="range"] { width: 100%; padding: 0; }
    .badge { min-width: 34px; text-align:center; font-weight:800; }
  </style>
</head>
<body>
  <h2>PEM Log</h2>
  <p class="sub">Quick check-in (30–45 seconds). Saves to your private Google Sheet.</p>

  <label>PEM severity (0–10)</label>
  <input id="pem" type="number" min="0" max="10" inputmode="numeric" placeholder="e.g., 6"/>

  <div class="row">
    <div>
      <label>Physical load</label>
      <select id="physical">
        <option value="">—</option>
        <option>Low</option><option>Medium</option><option>High</option>
      </select>
    </div>
    <div>
      <label>Cognitive load</label>
      <select id="cognitive">
        <option value="">—</option>
        <option>Low</option><option>Medium</option><option>High</option>
      </select>
    </div>
  </div>

  <div class="row">
    <div>
      <label>Emotional load</label>
      <select id="emotional">
        <option value="">—</option>
        <option>Low</option><option>Medium</option><option>High</option>
      </select>
    </div>
    <div>
      <label>Sensory load</label>
      <select id="sensory">
        <option value="">—</option>
        <option>Low</option><option>Medium</option><option>High</option>
      </select>
    </div>
  </div>

  <label>Symptoms (toggle any that apply, then rate 1–10)</label>
  <div id="symptomList"></div>

  <label>Triggers (best guess)</label>
  <div class="pillbox" id="triggers">
    <label class="pill"><input type="checkbox" value="Physical exertion">Physical exertion</label>
    <label class="pill"><input type="checkbox" value="Cognitive exertion">Cognitive exertion</label>
    <label class="pill"><input type="checkbox" value="Sensory overload">Sensory overload</label>
    <label class="pill"><input type="checkbox" value="Stress">Stress</label>
    <label class="pill"><input type="checkbox" value="Poor sleep">Poor sleep</label>
    <label class="pill"><input type="checkbox" value="Standing">Standing</label>
    <label class="pill"><input type="checkbox" value="Errands">Errands</label>
    <label class="pill"><input type="checkbox" value="Unknown">Unknown</label>
  </div>

  <label>Notes (optional)</label>
  <textarea id="notes" rows="3" placeholder="Anything important?"></textarea>

  <button id="submit" type="button">Save Entry</button>
  <div class="status" id="status"></div>
  <div class="tiny">Tip: Add this page to your home screen for one-tap logging.</div>

<script>
  // Paste your Apps Script Web App URL here (ends with /exec):
  const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbyDYb8dRkZjYNt42fqZIe_zaQp1YwuQDw9N1OsowXHaMhuy3rh5USC9F03_S-5tS8tX/exec";

  // Symptom list (toggle + rate)
  const SYMPTOMS = [
    "Brain-fog",
    "Burning sensation on skin",
    "Chronic pain (muscular or joint)",
    "Cognitive dysfunction",
    "Disturbed sleep pattern (lack of sleep or need to sleep too much often incl. vivid dreams)",
    "Eye symptoms",
    "Flu-like feelings",
    "Headaches and Migraines",
    "Heaviness in the limbs or whole body",
    "Heightened sensitivity to sensory stimuli (sound, light, smells)",
    "Increased chronic fatigue",
    "Loss of appetite",
    "Loss of stamina/ functional capacity",
    "Muscle fatigue and weakness",
    "Nausea",
    "Night sweats or chills",
    "Orthostatic intolerance/dizziness",
    "Problems regulating temperature (and cold/hot extremities)",
    "Heart palpitations",
    "Speech problems",
    "Temporary paralysis",
    "Short-term memory problems",
    "Sore throat",
    "Swollen and painful glands",
    "Tinnitus (ringing in the ears)",
    "Trembling/ instability of muscle and/or limbs",
    "Word-finding problems"
  ];

  function checkedValues(containerId) {
    return [...document.querySelectorAll(`#${containerId} input[type="checkbox"]:checked`)]
      .map(x => x.value);
  }

  function renderSymptoms() {
    const root = document.getElementById("symptomList");
    root.innerHTML = "";

    SYMPTOMS.forEach((name, i) => {
      const id = `sym_${i}`;
      const row = document.createElement("div");
      row.className = "symptomRow";

      row.innerHTML = `
        <div class="symptomTop">
          <label class="symptomName" for="${id}_chk">${name}</label>
          <input id="${id}_chk" type="checkbox" />
        </div>
        <div class="symptomControls" id="${id}_controls">
          <div class="sliderWrap">
            <span class="badge" id="${id}_val">5</span>
            <input id="${id}_range" type="range" min="1" max="10" step="1" value="5" />
          </div>
          <div class="tiny">1 = mild, 10 = worst</div>
        </div>
      `;

      root.appendChild(row);

      const chk = row.querySelector(`#${id}_chk`);
      const controls = row.querySelector(`#${id}_controls`);
      const range = row.querySelector(`#${id}_range`);
      const val = row.querySelector(`#${id}_val`);

      chk.addEventListener("change", () => {
        controls.style.display = chk.checked ? "block" : "none";
      });

      range.addEventListener("input", () => {
        val.textContent = range.value;
      });
    });
  }

  function collectSymptomRatings() {
    const out = {};
    const rows = document.querySelectorAll("#symptomList .symptomRow");
    rows.forEach((row, i) => {
      const name = SYMPTOMS[i];
      const checked = row.querySelector("input[type='checkbox']").checked;
      if (checked) {
        const rating = row.querySelector("input[type='range']").value;
        out[name] = Number(rating);
      }
    });
    return out;
  }

  window.addEventListener("DOMContentLoaded", renderSymptoms);

  document.getElementById("submit").addEventListener("click", async () => {
    const status = document.getElementById("status");
    status.className = "status";
    status.textContent = "Saving…";

    const payload = {
      pem: document.getElementById("pem").value,
      physical: document.getElementById("physical").value,
      cognitive: document.getElementById("cognitive").value,
      emotional: document.getElementById("emotional").value,
      sensory: document.getElementById("sensory").value,
      symptoms_rated: collectSymptomRatings(),
      triggers: checkedValues("triggers"),
      notes: document.getElementById("notes").value
    };

    try {
      const res = await fetch(WEB_APP_URL, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(payload)
      });

      const out = await res.json();
      if (!out.ok) throw new Error(out.error || "Unknown error");

      status.classList.add("ok");
      status.textContent = "Saved ✅";

      // Optional: clear notes after save
      document.getElementById("notes").value = "";
    } catch (err) {
      status.classList.add("bad");
      status.textContent = "Save failed ❌ " + err.message;
    }
  });
</script>
</body>
</html>
